<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ChatGPT</title>
  <meta name="theme-color" content="#ffffff" />

  <!-- Apply saved theme before first paint (no flash) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('cg-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <link rel="stylesheet" href="style.css" />

  <!-- Markdown, sanitizing, syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn logo-btn" id="logoBtn" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <path d="M12 2.8 19.9 7.4v9.2L12 21.2l-7.9-4.6V7.4z" />
            <path d="M12 7.6 15.8 9.8v4.4L12 16.4l-3.8-2.2V9.8z" />
            <path d="M12 2.8v4.8M19.9 7.4l-4.1 2.4M19.9 16.6l-4.1-2.4M12 21.2v-4.8M4.1 16.6l4.1-2.4M4.1 7.4l4.1 2.4" />
          </svg>
        </button>
        <button class="icon-btn" id="closeSidebarBtn" title="Close sidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M7.5 3.5v13"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item" id="newChatBtn">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5H6A2.5 2.5 0 0 0 3.5 6v8A2.5 2.5 0 0 0 6 16.5h8a2.5 2.5 0 0 0 2.5-2.5v-3.5"/><path d="M14.6 2.9a1.4 1.4 0 0 1 2 2L10 11.5l-2.6.6.6-2.6z"/></svg>
          <span>New chat</span>
        </button>
        <label class="nav-item search-item">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
          <input type="search" id="searchInput" placeholder="Search chats" autocomplete="off" />
        </label>
      </nav>

      <div class="history" id="history">
        <h3 class="history-label">Chats</h3>
        <div class="chat-list" id="chatList"></div>
        <p class="history-empty" id="historyEmpty">No chats yet</p>
      </div>

      <div class="sidebar-footer">
        <div class="profile">
          <div class="avatar">U</div>
          <div class="profile-text">
            <div class="profile-name">You</div>
            <div class="profile-plan">Free</div>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============ Main ============ -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn when-collapsed" id="openSidebarBtn" title="Open sidebar" aria-label="Open sidebar">
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M7.5 3.5v13"/></svg>
          </button>
          <button class="icon-btn when-collapsed" id="headerNewChatBtn" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5H6A2.5 2.5 0 0 0 3.5 6v8A2.5 2.5 0 0 0 6 16.5h8a2.5 2.5 0 0 0 2.5-2.5v-3.5"/><path d="M14.6 2.9a1.4 1.4 0 0 1 2 2L10 11.5l-2.6.6.6-2.6z"/></svg>
          </button>
          <button class="model-btn" id="modelBtn" aria-haspopup="menu">
            <span>ChatGPT</span>
            <span class="model-sub" id="modelLabel"></span>
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>
          </button>
        </div>
        <div class="topbar-right">
          <button class="icon-btn theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M16.5 11.6A6.8 6.8 0 0 1 8.4 3.5a6.8 6.8 0 1 0 8.1 8.1Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v1.8M10 16.4v1.8M1.8 10h1.8M16.4 10h1.8M4.2 4.2l1.3 1.3M14.5 14.5l1.3 1.3M4.2 15.8l1.3-1.3M14.5 5.5l1.3-1.3"/></svg>
          </button>
        </div>
      </header>

      <div class="content empty" id="content">
        <div class="thread" id="thread">
          <div class="messages" id="messages"></div>
        </div>

        <div class="composer-wrap">
          <button class="scroll-down" id="scrollDownBtn" aria-label="Scroll to bottom" hidden>
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v12M5.5 11.5 10 16l4.5-4.5"/></svg>
          </button>
          <h1 class="hero">What can I help with?</h1>
          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Ask anything" autocomplete="off"></textarea>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
              <svg class="icon-send" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg>
              <svg class="icon-stop" viewBox="0 0 20 20" width="20" height="20"><rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
            </button>
          </form>
          <p class="disclaimer">ChatGPT can make mistakes. Check important info.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Floating menu (chat options / model picker) -->
  <div class="menu" id="menu" role="menu" hidden></div>

  <!-- Delete confirmation -->
  <div class="modal-backdrop" id="deleteModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteHeading">
      <h2 id="deleteHeading">Delete chat?</h2>
      <p>This will delete <strong id="deleteTitle"></strong>.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
